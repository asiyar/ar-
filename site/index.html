<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARICIMAP</title>
<style>
  :root{--forest:#263f2d;--honey:#d59622;--cream:#f7f4eb;--line:#e0e4d9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:#2d3a2d;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;padding:30px}
  .card{max-width:520px;text-align:center}
  .bee{width:64px;height:64px;margin:0 auto 22px;border:3px solid var(--honey);border-radius:24px 24px 30px 30px;transform:rotate(45deg)}
  h1{margin:0;font-size:32px;letter-spacing:2px;color:var(--forest)}
  .sub{margin:8px 0 0;color:#6c7a6c;font-size:13px;letter-spacing:1px;text-transform:uppercase}
  p{margin:22px 0 0;color:#4a5a4b}
  .links{margin-top:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .links a{padding:11px 18px;border:1px solid var(--line);border-radius:9px;background:#fffdfa;color:#3f5f45;text-decoration:none;font-weight:600;font-size:15px}
  .links a:hover{background:#f0f5eb}
</style>
</head>
<body>
<div class="card">
  <div class="bee"></div>
  <h1>ARICIMAP</h1>
  <p class="sub">Arıcı Saha ve Arılık Konum Sistemi</p>
  <p>Arılık konumlarını haritada işaretleyin, kovan denetimlerini kaydedin ve saha ekibinizle koordinasyon kurun. Verileriniz cihazınızda kalır.</p>
  <div class="links">
    <a href="./privacy.html">Gizlilik Politikası</a>
    <a href="./support.html">Destek</a>
  </div>
</div>
</body>
</html>
