name: Android Test APK

# Telefona doğrudan kurulabilen APK üretir. Yalnızca test içindir.
# Play Store'a yüklenecek dosya için "Android Release AAB" workflow'unu kullan.
#
# Elle çalıştırılır: Actions -> Android Test APK -> Run workflow
#
# İki seçenek var:
#   debug   -> Hiçbir secret gerektirmez. Android'in kendi debug anahtarıyla
#              imzalanır. Hızlı test için bunu kullan.
#   release -> Kendi upload keystore'unla imzalanır. Mağazadaki sürümle aynı
#              yapılandırmayı test etmek istediğinde kullan.
#              ANDROID_KEYSTORE_* secret'larının tanımlı olması gerekir.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK türü"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sürüm bilinçli olarak verilmiyor: action, package.json içindeki
      # "packageManager" alanını okur. İkisi birden verilirse
      # "Multiple versions of pnpm specified" hatası alınır.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      # Yalnızca release seçildiğinde keystore çözülür.
      - name: Decode upload keystore
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret'ı tanımlı değil. Debug APK deneyin."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aricimap-upload.jks"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          ARICIMAP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARICIMAP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARICIMAP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ARICIMAP_RELEASE_STORE_FILE="$RUNNER_TEMP/aricimap-upload.jks"
          cd android
          chmod +x ./gradlew
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Show the built APK
        run: |
          APK=$(find android -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Üretilen dosya: $APK"
          ls -lh "$APK"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aricimap-upload.jks"

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aricimap-${{ github.event.inputs.build_type }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14android-apk.yml
