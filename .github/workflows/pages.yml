name: Publish site

# site/ klasörünü GitHub Pages'e yayınlar.
# Yayınlanan adresler:
#   https://<kullanıcı>.github.io/aricimap/privacy.html
#   https://<kullanıcı>.github.io/aricimap/support.html
#
# İlk kullanımda: repo → Settings → Pages → Source: "GitHub Actions" seç.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
