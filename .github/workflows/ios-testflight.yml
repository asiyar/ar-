name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BUNDLE_ID: com.arcadianstore.aricimap
  MARKETING_VERSION: '1.4'

jobs:
  build-and-upload:
    name: Build and upload iOS IPA
    # Önceki başarısız derlemeler macos-14 (Xcode 15.4) üzerinde çalışıyordu.
    # Capacitor 8.5 ve @capacitor/geolocation'ın SPM paketleri Swift 5.9+ ve
    # güncel bir Xcode bekliyor; GeolocationPlugin hedefindeki derleme hatasının
    # en olası sebebi budur.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Sürüm bilinçli olarak verilmiyor: action, package.json içindeki
      # "packageManager" alanını okur. İkisi birden verilirse
      # "Multiple versions of pnpm specified" hatası alınır.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: pnpm exec cap sync ios

      - name: Install Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        id: download_profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Resolve provisioning profile metadata
        id: profile
        shell: bash
        run: |
          PROFILE_PATH="$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name '*.mobileprovision' -type f -print -quit)"
          test -n "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          echo "profile-name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile-uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Resolve iOS dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile-name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ARICIMAP.xcarchive" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            archive

      - name: Export IPA
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile-name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ARICIMAP.xcarchive" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # altool, .p8 anahtarını ~/.private_keys/AuthKey_<KEYID>.p8 yolunda arar.
      # Bu dosya yazılmazsa yükleme adımı kimlik doğrulayamaz.
      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)
          echo "Yukleniyor: $IPA_PATH"

          xcrun altool --validate-app \
            --type ios --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

          xcrun altool --upload-app \
            --type ios --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Clean up private key
        if: always()
        run: rm -rf ~/.private_keys

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aricimap-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7
