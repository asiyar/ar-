name: Android Release AAB

# Manuel çalıştırma veya android-v* etiketi ile tetiklenir.
#   git tag android-v1.4.0 && git push origin android-v1.4.0
#
# Bu workflow imzalı bir AAB üretir ve artifact olarak bırakır.
# Play Console'a yükleme bilinçli olarak otomatikleştirilmemiştir; AAB'yi
# indirip Kapalı test (Alpha) kanalına elle yüklemen gerekir.

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aricimap-upload.jks"

      - name: Build release AAB
        env:
          ARICIMAP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARICIMAP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARICIMAP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ARICIMAP_RELEASE_STORE_FILE="$RUNNER_TEMP/aricimap-upload.jks"
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the AAB is signed
        run: |
          AAB=$(find android -name '*.aab' | head -n 1)
          echo "Built: $AAB"
          unzip -l "$AAB" | grep -q 'META-INF' && echo "signature block present"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aricimap-upload.jks"

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aricimap-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
