<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#263f2d" />
<title>ARICIMAP</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root{
    --forest:#263f2d; --forest-2:#355a3f; --moss:#668447; --honey:#d59622;
    --cream:#f7f4eb; --card:#fffdfa; --ink:#2d3a2d; --muted:#728072;
    --line:#e0e4d9; --danger:#b95748; --success:#31794d; --blue:#2d7897;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:10px 11px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:78px}
  label{display:block;margin-bottom:11px;font-size:12px;color:#54654f;font-weight:600}
  label>input,label>select,label>textarea{margin-top:5px;font-weight:400}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border:0;border-radius:9px;background:var(--forest);color:#f2f7ee;
    font-weight:600;font-size:14px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.honey{background:var(--honey);color:#4a350c}
  .btn.ghost{background:#fff;color:#3f5a41;border:1px solid var(--line)}
  .btn.danger{background:var(--danger)}
  .btn.small{padding:7px 11px;font-size:12px;border-radius:8px}
  .btn.full{width:100%}
  .overline{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px}
  .row{display:flex;gap:9px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted);font-size:12px}
  .hidden{display:none !important}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.4px}
  .pill.green{background:#e2f0e4;color:var(--success)}
  .pill.red{background:#fbe6e2;color:var(--danger)}
  .pill.grey{background:#eceee7;color:var(--muted)}
  .pill.honey{background:#fdf0d4;color:#8a6412}

  /* --- Giriş ekranı --- */
  #authView{min-height:100dvh;display:grid;place-items:center;padding:26px 20px}
  .auth-box{width:100%;max-width:360px}
  .brand{text-align:center;margin-bottom:24px}
  .brand .mark{width:52px;height:52px;margin:0 auto 14px;border:3px solid var(--honey);
    border-radius:20px 20px 26px 26px;transform:rotate(45deg)}
  .brand h1{margin:0;font-size:25px;letter-spacing:2.5px;color:var(--forest)}
  .brand p{margin:6px 0 0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;padding:4px;background:#eceee7;border-radius:11px}
  .tabs button{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;
    color:#5d6d5c;font-weight:600;font-size:13px}
  .tabs button.on{background:#fff;color:var(--forest);box-shadow:0 1px 4px rgba(38,63,45,.1)}
  .note{margin:0 0 14px;padding:11px 13px;border-left:3px solid var(--honey);
    background:#fff9e8;border-radius:0 8px 8px 0;font-size:12px;line-height:1.55;color:#5f6b57}
  .error{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#fbe6e2;
    color:#8f3d31;font-size:12.5px;line-height:1.5}
  .ok{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#e2f0e4;
    color:#26603c;font-size:12.5px;line-height:1.5}

  /* --- Uygulama kabuğu --- */
  #appView{min-height:100dvh;display:flex;flex-direction:column}
  header.top{position:sticky;top:0;z-index:400;display:flex;align-items:center;gap:10px;
    padding:11px 14px;background:var(--forest);color:#eaf2e6}
  header.top .who{flex:1;min-width:0}
  header.top .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.top .who span{font-size:10.5px;color:#a9c0a7;letter-spacing:.4px}
  .bell{position:relative;width:38px;height:38px;border:0;border-radius:10px;
    background:rgba(255,255,255,.11);color:#eaf2e6;font-size:16px}
  .bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;background:var(--honey);color:#4a350c;font-size:10px;line-height:18px}
  main{flex:1;padding:14px;padding-bottom:78px;max-width:760px;width:100%;margin:0 auto}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:400;display:flex;
    background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom button{flex:1;padding:9px 4px 11px;border:0;background:transparent;
    color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;
    align-items:center;gap:3px}
  nav.bottom button .ic{font-size:17px;line-height:1}
  nav.bottom button.on{color:var(--forest)}

  #map{height:min(58dvh,430px);border-radius:12px;border:1px solid var(--line);background:#e8ece3}
  .leaflet-container{font:inherit}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

  .list-item{padding:12px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:0;padding-bottom:0}
  .list-item h4{margin:0 0 3px;font-size:13.5px}
  .empty{padding:22px 6px;text-align:center;color:var(--muted);font-size:12.5px}

  .sheet{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;
    justify-content:center;background:rgba(24,38,27,.45)}
  .sheet.open{display:flex}
  .sheet-body{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
    background:var(--cream);border-radius:16px 16px 0 0;padding:18px 16px 26px}
  .sheet-body h3{margin:0 0 4px;font-size:17px;color:var(--forest)}
  .sheet-grip{width:38px;height:4px;border-radius:99px;background:#cfd6c9;margin:0 auto 14px}

  .toast{position:fixed;left:50%;bottom:88px;z-index:1200;transform:translateX(-50%);
    max-width:calc(100% - 32px);padding:11px 15px;border-radius:10px;background:var(--forest);
    color:#eef4ea;font-size:12.5px;box-shadow:0 8px 24px rgba(30,52,36,.28);display:none}
  .toast.show{display:block}
</style>
</head>
<body>

<!-- Giriş / kayıt -->
<section id="authView" class="hidden">
  <div class="auth-box">
    <div class="brand">
      <div class="mark"></div>
      <h1>ARICIMAP</h1>
      <p>Arıcı Saha ve Arılık Konum Sistemi</p>
    </div>

    <div class="tabs">
      <button id="tabLogin" class="on">Giriş yap</button>
      <button id="tabRegister">Kayıt ol</button>
    </div>

    <div id="authMsg"></div>

    <form id="loginForm" class="card">
      <label>Telefon<input id="loginPhone" type="tel" inputmode="numeric" autocomplete="username" placeholder="05XX XXX XX XX" /></label>
      <label>Parola<input id="loginPassword" type="password" autocomplete="current-password" /></label>
      <button class="btn full" type="submit">Giriş yap</button>
    </form>

    <form id="registerForm" class="card hidden">
      <p class="note">Arıcıysan onay beklemeden kullanmaya başlarsın. Kurum personeliysen kaydolduktan sonra <b>Yetki başvurusu</b> bölümünden kurum bilgilerini gönder.</p>
      <label>Ad soyad<input id="regName" autocomplete="name" /></label>
      <label>Telefon<input id="regPhone" type="tel" inputmode="numeric" autocomplete="username" placeholder="05XX XXX XX XX" /></label>
      <label>Parola<input id="regPassword" type="password" autocomplete="new-password" placeholder="En az 6 karakter" /></label>
      <button class="btn full" type="submit">Kayıt ol</button>
    </form>
  </div>
</section>

<!-- Uygulama -->
<section id="appView" class="hidden">
  <header class="top">
    <div class="who">
      <b id="userName">—</b>
      <span id="userRole"></span>
    </div>
    <button class="bell" id="bellBtn" title="Bildirimler">✉<b id="bellCount" class="hidden">0</b></button>
    <button class="bell" id="logoutBtn" title="Çıkış">⏻</button>
  </header>

  <main>
    <div id="pageHarita"></div>
    <div id="pageKutu" class="hidden"></div>
    <div id="pageSaha" class="hidden"></div>
    <div id="pageDefter" class="hidden"></div>
    <div id="pageYonetim" class="hidden"></div>
    <div id="pageHesap" class="hidden"></div>
  </main>

  <nav class="bottom" id="bottomNav"></nav>
</section>

<div class="sheet" id="sheet"><div class="sheet-body"><div class="sheet-grip"></div><div id="sheetContent"></div></div></div>
<div class="toast" id="toast"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/aricimap-server-client.js"></script>
<script src="/aricimap-app.js"></script>
</body>
</html>
